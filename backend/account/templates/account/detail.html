<!-- account/templates/account/detail.html -->

{% extends "layout/main_layout.html" %} 

{% block title%}회원정보 조회{% endblock title%}
{% block contents %}
<h1>회원정보</h1>
<table class="table">
    <tr>
        <th>ID</th>
        <td>{{user.username}}</td>
    </tr>
    <tr>
        <th>이름</th>
        <td>{{user.name}}</td>
    </tr>
</table>

<div class="mt-3">
    <a href="{% url 'account:update' %}" class="btn btn-primary">정보수정</a>
    <a href="{% url 'account:password_change' %}" class="btn btn-primary">
        패스워드 변경
    </a>
    <a href="{% url 'account:delete' %}" class="btn btn-danger" onclick="return confirm('정말 탈퇴하겠습니까?')">
        탈퇴
    </a>
</div>

{% endblock contents %}
